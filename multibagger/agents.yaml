# Agent registry. The portal, the runner and the deploy script all read this file.
# Schedules are cron in Asia/Kolkata time. Phase 2 agents ship disabled until the LLM layer is built.
agents:
  - id: universe
    name: Universe builder
    description: Downloads the NSE equity list (symbol, ISIN, name, listing date) and keeps the universe table fresh.
    schedule: "0 6 * * 1"        # Mondays 06:00
    cadence: weekly
    phase: 1
  - id: ingestion
    name: Ingestion agent
    description: Loads announcement CSVs you upload on the Data page into the filings table and runs the red-flag keyword checks on them. Runs right after each upload; the daily run picks up anything missed.
    schedule: "30 19 * * 1,4"    # Mon and Thu 19:30, after the desktop download
    cadence: twice weekly
    phase: 1
  - id: forensic
    name: Forensic agent
    description: Runs the red-flag checklist on structured fundamentals and new filings. Hard flags raise alerts within a day.
    schedule: "0 20 * * 1,4"     # Mon and Thu 20:00
    cadence: twice weekly
    phase: 1
  - id: screener
    name: Screener agent
    description: Runs the Pass 1 quantitative screen on the uploaded fundamentals export and hands survivors to the watchlist.
    schedule: "0 7 * * 6"        # Saturdays 07:00
    cadence: weekly
    phase: 1
